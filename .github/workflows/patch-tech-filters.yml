name: Patch technical filters

on:
  push:
    paths:
      - 'scripts/patch-tech-filters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply technical viewer patch
        run: python scripts/patch-tech-filters.py
      - name: Validate JavaScript
        run: |
          node --check dist/app.js
          git diff --check
      - name: Commit patched viewer
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js
          git commit -m 'Fix technical filters and cut controls'
          git push
