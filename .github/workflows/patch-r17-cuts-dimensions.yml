name: Patch R17 cuts and dimensions

on:
  push:
    paths:
      - 'scripts/patch-r17-cuts-dimensions.py'
      - '.github/workflows/patch-r17-cuts-dimensions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R17 patch
        run: python scripts/patch-r17-cuts-dimensions.py
      - name: Validate JavaScript
        run: |
          node --check dist/app.js
          node --check dist/dimensions-r9.js
          python - <<'PY'
          from pathlib import Path
          app=Path('dist/app.js').read_text(encoding='utf-8')
          dim=Path('dist/dimensions-r9.js').read_text(encoding='utf-8')
          checks={
            'semantic labels':'function dimensionLabels(data)' in app,
            'section position':'positionText:' in app,
            'section extension lines':'sectionLine([ue1,u1,ue2,u2,ve1,v1,ve2,v2]' in app,
            'compact cut callout':'cross*(.24+' in app,
            'overlay cut position':'Corte: ${s.positionText}' in dim,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Missing R17 checks: '+', '.join(bad))
          print('R17 validation OK:', ', '.join(checks))
          PY
      - name: Commit generated files
        run: |
          if git diff --quiet -- dist/app.js dist/dimensions-r9.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/dimensions-r9.js
          git commit -m 'R17: improve cuts and dimensions'
          git push
