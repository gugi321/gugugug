name: CAD build check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cad-build-check.yml'
      - 'cad-app/**'
      - 'vite.cad.config.ts'
      - 'vite.libredwg-worker.config.ts'
      - 'package.json'
      - 'scripts/check-cad-deps.mjs'
      - 'scripts/validate-cad-build.mjs'
      - 'dist/dwg.js'
      - 'dist/cad-embed.css'
      - 'dist/version.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build:cad
      - name: Validate CAD runtime
        run: |
          test -s dist/cad/index.html
          test -s dist/cad/assets/libredwg-parser-worker.js
          test -s dist/cad/assets/libredwg-web.wasm
          node -e "const fs=require('fs');const b=fs.readFileSync('dist/cad/assets/libredwg-web.wasm');if(!(b[0]===0&&b[1]===97&&b[2]===115&&b[3]===109))process.exit(1);console.log('WASM OK',b.length)"
