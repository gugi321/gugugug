name: Patch section reinforcement association

on:
  push:
    paths:
      - 'scripts/patch-section-association.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reinforcement association patch
        run: python scripts/patch-section-association.py
      - name: Validate viewer JavaScript
        run: |
          node --check dist/app.js
          node --check dist/properties.js
          git diff --check
      - name: Commit generated viewer files
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/properties.js
          git commit -m 'Associate reinforcement by geometry and read type diameters'
          git push
