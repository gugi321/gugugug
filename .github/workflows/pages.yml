name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'cad-app/**'
      - 'scripts/prepare-pages.mjs'
      - 'scripts/smoke-web-ifc.mjs'
      - 'scripts/smoke-web-cad.mjs'
      - 'tests/fixtures/**'
      - 'vite.cad.config.ts'
      - 'vite.libredwg-worker.config.ts'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Mini CAD
        run: npm run build:cad

      - name: Validate static JavaScript
        run: |
          node --check dist/dwg.js
          node --check dist/share-r9.js
          node --check dist/eng-r10.js
          node --check dist/dimensions-r9.js
          node --check dist/github-pages.js
          node --check dist/sw.js
          if [ -f dist/quantities.js ]; then node --check dist/quantities.js; fi

      - name: Prepare self-contained mobile site
        run: node scripts/prepare-pages.mjs

      - name: Verify local IFC/CAD runtime assets
        shell: bash
        run: |
          test -s site/vendor/three/three.module.js
          test -s site/vendor/web-ifc/web-ifc-api.js
          test -s site/vendor/web-ifc/web-ifc.wasm
          test -s site/vendor/pdfjs/pdf.mjs
          test -s site/cad/assets/libredwg-parser-worker.js
          test -s site/cad/assets/libredwg-web.wasm
          grep -q "./vendor/web-ifc/web-ifc-api.js" site/app.js
          grep -q "./vendor/three/three.module.js" site/index.html

      - name: Install browser engines for functional smoke tests
        run: npx playwright install --with-deps chromium webkit

      - name: Open real IFC on Android Chromium and iPhone WebKit
        env:
          SMOKE_ROOT: site
        run: npm run test:web-ifc

      - name: Download pinned LibreDWG sample for functional CAD test
        shell: bash
        run: |
          mkdir -p tests
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/LibreDWG/libredwg/f860b0fb76d5f8effb5a70769a3389cb1e0308c8/test/test-data/sample_2000.dwg' \
            --output tests/runtime-sample.dwg
          test -s tests/runtime-sample.dwg
          test $(stat -c%s tests/runtime-sample.dwg) -gt 1000

      - name: Open real DWG with LibreDWG/WASM
        env:
          SMOKE_ROOT: site
          DWG_FIXTURE: tests/runtime-sample.dwg
        run: node scripts/smoke-web-cad.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
