name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Mini CAD
        run: npm run build:cad

      - name: Validate static JavaScript
        run: |
          node --check dist/dwg.js
          node --check dist/share-r9.js
          node --check dist/eng-r10.js
          node --check dist/dimensions-r9.js
          node --check dist/github-pages.js
          node --check dist/sw.js
          if [ -f dist/quantities.js ]; then node --check dist/quantities.js; fi

      - name: Prepare self-contained mobile site
        run: node scripts/prepare-pages.mjs

      - name: Verify local IFC runtime assets
        shell: bash
        run: |
          test -s site/vendor/three/three.module.js
          test -s site/vendor/web-ifc/web-ifc-api.js
          test -s site/vendor/web-ifc/web-ifc.wasm
          test -s site/vendor/pdfjs/pdf.mjs
          test -s site/cad/assets/libredwg-parser-worker.js
          test -s site/cad/assets/libredwg-web.wasm
          grep -q "./vendor/web-ifc/web-ifc-api.js" site/app.js
          grep -q "./vendor/three/three.module.js" site/index.html

      - name: Install browser engines for real IFC smoke tests
        run: npx playwright install --with-deps chromium webkit

      - name: Open real IFC on Android Chromium and iPhone WebKit
        env:
          SMOKE_ROOT: site
        run: npm run test:web-ifc

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
