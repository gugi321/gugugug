name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install locked app dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Mini CAD
        run: npm run build:cad

      - name: Validate static JavaScript
        run: |
          node --check dist/dwg.js
          node --check dist/share-r9.js
          node --check dist/eng-r10.js
          node --check dist/dimensions-r9.js
          if [ -f dist/quantities.js ]; then node --check dist/quantities.js; fi

      - name: Prepare static site
        shell: bash
        run: |
          rm -rf site
          cp -R dist site
          python - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<base href="/">', '<base href="./">')
          if 'github-pages.js' not in s:
              s = s.replace('</body>', '<script type="module" src="github-pages.js"></script></body>')
          p.write_text(s, encoding="utf-8")
          PY
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
