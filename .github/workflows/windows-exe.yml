name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/prepare-desktop.mjs'
      - 'scripts/validate-desktop.mjs'
      - 'scripts/smoke-desktop-ifc.mjs'
      - 'tests/fixtures/**'
      - 'cad-app/**'
      - 'vite.cad.config.ts'
      - 'vite.libredwg-worker.config.ts'
      - 'dist/**'
      - 'package.json'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build, open real IFC, and package Windows app
        run: npm run build:windows

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Executável Windows não foi gerado.' }
          if ($exe.Length -lt 50000000) { throw "Executável muito pequeno: $($exe.Length) bytes" }
          Write-Host "EXE OK: $($exe.FullName) - $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Eng-Gustavo-G-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
