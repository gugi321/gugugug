name: Patch section diagnostics

on:
  push:
    paths:
      - 'scripts/patch-section-api.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply section diagnostics patch
        run: python scripts/patch-section-api.py
      - name: Validate viewer JavaScript
        run: |
          node --check dist/app.js
          node --check dist/dimensions-r9.js
          git diff --check
      - name: Commit generated viewer files
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/index.html
          git commit -m 'Expose section diagnostics and load dimension overlay'
          git push
