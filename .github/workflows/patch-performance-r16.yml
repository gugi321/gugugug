name: Apply R16 performance patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-performance-r16.py'
      - '.github/workflows/patch-performance-r16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize R16 matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-performance-r16.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('    " camera.up.copy(f.v);camera.position.copy(center)', '    "camera.up.copy(f.v);camera.position.copy(center)')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Apply R16 patch
        run: python scripts/patch-performance-r16.py
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check dist/app.js
          node --check dist/dwg.js
          node --check dist/dimensions-r9.js
          node --check dist/github-pages.js
          node --check dist/sw.js
      - name: Validate R16 performance guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('dist/app.js').read_text(encoding='utf-8')
          dwg=Path('dist/dwg.js').read_text(encoding='utf-8')
          dim=Path('dist/dimensions-r9.js').read_text(encoding='utf-8')
          gp=Path('dist/github-pages.js').read_text(encoding='utf-8')
          sw=Path('dist/sw.js').read_text(encoding='utf-8')
          html=Path('dist/index.html').read_text(encoding='utf-8')
          css=Path('dist/ui-polish-r15.css').read_text(encoding='utf-8')
          checks={
            'preserveDrawingBuffer disabled':'preserveDrawingBuffer:false' in app,
            'continuous animation loop removed':'setAnimationLoop' not in app,
            'file input kept hidden':"input[type=\\\"file\\\"]" in app or "input[type=\"file\"]" in app,
            'section contour debounce enabled':'sectionContourTimer' in app,
            'section context host only':"m.userData.id===s.hostID" in app,
            'discipline cache enabled':'ggDisciplineCache' in app,
            'CAD iframe not eager':'loading="eager"' not in dwg,
            'CAD iframe starts without src':'id="cadFrame" title=' in dwg,
            'quantities not eagerly imported':"import('./quantities.js').catch" not in dwg,
            'tools not eagerly imported by dimensions':"import './eng-r10.js'" not in dim,
            'tools not eagerly imported by pages bootstrap':"import('./eng-r10.js').catch" not in gp,
            'service worker R16 cache':'eng-gustavo-g-r16' in sw,
            'heavy tools absent from SW core':"'./eng-r10.js'" not in sw and "'./dwg.js'" not in sw,
            'compact overlay override':'max-width:min(330px' in css,
            'R16 build label':'R16 leve' in html,
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items(): print(('OK  ' if ok else 'FAIL')+name)
          if failed: raise SystemExit('R16 guard failures: '+', '.join(failed))
          PY
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/dwg.js dist/dimensions-r9.js dist/github-pages.js dist/sw.js dist/ui-polish-r15.css dist/index.html
          git commit -m 'R16: lighten renderer, cut view and lazy-load tools'
          git push
