version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bahia"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      mlightcad:
        patterns:
          - "@mlightcad/*"
      build-tools:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Bahia"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
